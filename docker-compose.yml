version: '3.8'

services:
  muse2api:
    build: .
    image: muse2api:latest
    container_name: muse2api
    restart: always
    ports:
      - "18610:18610"
    environment:
      # Admin and API auth key (read from .env or the host environment; auto-generated if empty)
      - MUSE2API_KEY=${MUSE2API_KEY:-}
      # Public base URL of the service, e.g. https://your-domain.com (if empty, the admin frontend detects the current domain automatically)
      - MUSE2API_PUBLIC_BASE=
      # Timeouts (seconds)
      - MUSE2API_IMAGE_TIMEOUT=240
      - MUSE2API_VIDEO_TIMEOUT=600
      - MUSE2API_CHAT_TIMEOUT=300
    volumes:
      # Persist account configuration, task logs and media files
      - ./data:/app/data
    shm_size: '2gb' # Prevents Chromium from crashing when /dev/shm runs out while rendering multiple tabs
