# ==========================================
# MUSE2API Nginx reverse proxy example configuration
# ==========================================
# Works with BT Panel / 1Panel / standalone Nginx
# Key points: raise proxy_read_timeout and disable proxy_buffering to keep SSE streaming working
# ==========================================

server {
    listen 80;
    server_name your-domain.com; # Replace with your own domain or IP

    # Allow reference image uploads (large multimodal images for image-to-image / image editing)
    client_max_body_size 64M;

    location / {
        proxy_pass http://127.0.0.1:18610;

        # Key: image and video generation take 30-120 seconds; the default 60s makes Nginx return 502 Bad Gateway
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;

        # Key: disable buffering so /v1/chat/completions SSE streaming outputs tokens with zero delay
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
